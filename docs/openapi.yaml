openapi: 3.0.3
info:
  title: Lost & Found API
  version: 1.0.0
  description: |
    REST API for the Lost & Found platform.

    Authentication uses a short-lived JWT stored in an **HttpOnly cookie**
    (`lost_and_found_token`). Send `credentials: 'include'` from the browser;
    no token appears in JavaScript or in response bodies.

    All responses share one envelope:
    - success: `{ "success": true, "data": ..., "message"?: "..." }`
    - failure: `{ "success": false, "message": "...", "errors": [{ "field", "message" }] }`
servers:
  - url: http://localhost:5000/api
    description: Local development
tags:
  - name: auth
  - name: users
  - name: items
  - name: lostReports
  - name: claims

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lost_and_found_token
  parameters:
    itemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f\d]{24}$' }
    claimId:
      name: claimId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f\d]{24}$' }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    limit:
      name: limit
      in: query
      description: Clamped to a maximum of 50.
      schema: { type: integer, minimum: 1, default: 12 }
  schemas:
    Error:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, enum: [false] }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string, minLength: 3, maxLength: 30 }
        discordUsername: { type: string, minLength: 2, maxLength: 32 }
        email: { type: string, format: email }
        phone: { type: string }
        createdAt: { type: string, format: date-time }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    ItemImage:
      type: object
      properties:
        url: { type: string }
        publicId:
          type: string
          description: Owner responses only; never exposed publicly.
    PublicItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        images:
          type: array
          items: { $ref: '#/components/schemas/ItemImage' }
        status: { type: string, enum: [ACTIVE, CLAIMED, RETURNED, CLOSED, HIDDEN] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        owner:
          type: object
          properties:
            id: { type: string }
            username: { type: string }
    OwnerItem:
      allOf:
        - $ref: '#/components/schemas/PublicItem'
        - type: object
          properties:
            acceptedClaim: { type: string, nullable: true }
            returnedAt: { type: string, format: date-time, nullable: true }
    Claim:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, WITHDRAWN] }
        message:
          type: string
          description: Private proof details — visible only to claimant and listing owner.
        createdAt: { type: string, format: date-time }
        decisionAt: { type: string, format: date-time, nullable: true }
        claimant:
          type: object
          properties:
            id: { type: string }
            username: { type: string }
        item:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            status: { type: string }
            thumbnail: { type: string, nullable: true }
  responses:
    BadRequest:
      description: Validation failed — `errors` lists field-level problems
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, discordUsername, email, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 30 }
                discordUsername: { type: string, minLength: 2, maxLength: 32 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Account created; session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Email already registered }
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Signed in; session cookie set
        '401': { description: Generic invalid-credentials error }
        '429': { description: Rate limit exceeded }
  /auth/me:
    get:
      tags: [auth]
      summary: Current user
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Safe profile of the signed-in user
        '401': { description: Not authenticated }
  /auth/logout:
    post:
      tags: [auth]
      summary: Clear the session cookie
      responses:
        '200': { description: Signed out }
  /users/me:
    get:
      tags: [users]
      summary: Get own profile
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Safe profile }
        '401': { description: Not authenticated }
    patch:
      tags: [users]
      summary: Update allowed profile fields (never role)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string, minLength: 3, maxLength: 30 }
                email: { type: string, format: email }
                phone: { type: string }
                discordUsername: { type: string, minLength: 2, maxLength: 32 }
      responses:
        '200': { description: Updated profile }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Email already in use }

  /users/{userId}:
    get:
      tags: [users]
      summary: View another account's public profile
      security: [{ sessionCookie: [] }]
      description: |
        Returns only `username`, `discordUsername` and `createdAt` so
        signed-in users can contact each other on Discord. Email and phone are
        never returned by this endpoint.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Public profile of the user
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Not authenticated }
        '404': { description: User not found }

  /items:
    post:
      tags: [items]
      summary: "Publish a found item (multipart: fields + images)"
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, images]
              properties:
                title: { type: string, minLength: 3, maxLength: 120 }
                images:
                  type: array
                  maxItems: 5
                  items: { type: string, format: binary }
      responses:
        '201': { description: Listing published (status ACTIVE) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Not authenticated }
        '413': { description: Image larger than 5 MB }
        '415': { description: Unsupported image type/content }

  /items/mine:
    get:
      tags: [items]
      summary: Current user's listings (all statuses)
      security: [{ sessionCookie: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, CLAIMED, RETURNED, CLOSED, HIDDEN] }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200': { description: Paginated owner listings }
        '401': { description: Not authenticated }

  /items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/itemId'
    get:
      tags: [items]
      summary: Listing detail — never public
      description: >-
        Visible to the listing owner (owner-scoped fields) and to signed-in
        users whose lost report matched this item. Everyone else receives 404,
        so the existence of an item is never revealed to outsiders.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Listing detail (owner or matched searcher) }
        '401': { description: Not authenticated }
        '404': { description: Not found or not visible to this user }
    patch:
      tags: [items]
      summary: Update own listing (owner only)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any subset of the create fields; `createdBy`/`status` are never accepted.
      responses:
        '200': { description: Updated owner listing }
        '403': { description: Not the owner }
        '404': { description: Not found }
    delete:
      tags: [items]
      summary: Permanently delete own listing
      description: >-
        Deletes the listing, its images, and its claims, and removes every
        reference to it from saved lost-report matches. A deleted listing can
        never appear in search results again.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Listing permanently deleted }
        '403': { description: Not the owner }
        '404': { description: Not found }

  /items/{itemId}/return:
    parameters:
      - $ref: '#/components/parameters/itemId'
    patch:
      tags: [items]
      summary: Owner marks a CLAIMED listing as RETURNED
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Marked returned }
        '409': { description: No accepted claim on the listing }

  /items/{itemId}/images:
    parameters:
      - $ref: '#/components/parameters/itemId'
    post:
      tags: [items]
      summary: Owner adds images (max 5 per listing)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  maxItems: 5
                  items: { type: string, format: binary }
      responses:
        '200': { description: Images added }
        '409': { description: Listing already has 5 images }

  /items/{itemId}/images/{publicId}:
    parameters:
      - $ref: '#/components/parameters/itemId'
      - name: publicId
        in: path
        required: true
        description: URL-encoded provider asset id (the last image cannot be removed).
        schema: { type: string }
    delete:
      tags: [items]
      summary: Owner removes one image
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Image removed }
        '404': { description: Image not on listing }
        '409': { description: A listing must keep at least one image }

  /items/{itemId}/claims:
    parameters:
      - $ref: '#/components/parameters/itemId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
    get:
      tags: [claims]
      summary: Claims on own listing (owner only, else 403)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Paginated claims with claimant display names }
        '403': { description: Not the owner }

  /lost-reports:
    post:
      tags: [lostReports]
      summary: "Create a lost report and run the photo search (multipart: fields + images)"
      description: >-
        Uploads 1–3 photos of the lost item (a similar photo works too),
        immediately scores them against every ACTIVE found item using image
        embeddings, and stores the matches above the similarity threshold.
        Found items are only ever revealed through this flow.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, images]
              properties:
                title: { type: string, minLength: 3, maxLength: 120 }
                images:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items: { type: string, format: binary }
      responses:
        '201': { description: Report created with its initial matches }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Not authenticated }
        '413': { description: Image larger than 5 MB }
        '415': { description: Unsupported image type/content }
    get:
      tags: [lostReports]
      summary: Current user's lost reports with their latest matches
      security: [{ sessionCookie: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, CLOSED] }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200': { description: Paginated lost reports }
        '401': { description: Not authenticated }

  /lost-reports/{reportId}:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [lostReports]
      summary: Own lost report detail (with matches)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Lost report with matches }
        '401': { description: Not authenticated }
        '404': { description: Not found }
    patch:
      tags: [lostReports]
      summary: Update own lost report (any subset of fields, or status OPEN/CLOSED)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 3, maxLength: 120 }
                status: { type: string, enum: [OPEN, CLOSED] }
      responses:
        '200': { description: Updated lost report }
        '404': { description: Not found }
    delete:
      tags: [lostReports]
      summary: Delete own lost report (and its photos)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Report deleted }
        '404': { description: Not found }

  /lost-reports/{reportId}/search:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [lostReports]
      summary: Re-run the photo search for a lost report
      description: >-
        Recomputes matches against all currently ACTIVE found items, so
        listings published after the last search can appear.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Fresh matches stored on the report }
        '401': { description: Not authenticated }
        '404': { description: Not found }

  /claims:
    post:
      tags: [claims]
      summary: Submit a private claim
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, message]
              properties:
                itemId: { type: string }
                message: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '201': { description: Claim created (PENDING) }
        '403': { description: Claiming own listing }
        '409': { description: Duplicate pending claim or listing not ACTIVE }
        '429': { description: Rate limit exceeded }

  /claims/{claimId}/decision:
    parameters:
      - $ref: '#/components/parameters/claimId'
    patch:
      tags: [claims]
      summary: Owner accepts or rejects a pending claim (atomic)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [ACCEPTED, REJECTED] }
      responses:
        '200': { description: Decision recorded }
        '403': { description: Not the listing owner }
        '409': { description: Claim already decided or listing no longer claimable }

